name: Render & Deploy

on:
  push:
    branches:
      - main
    paths:
      - "*.yaml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-cv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar RenderCV e Typst
        run: |
          python -m pip install --upgrade pip
          pip install "rendercv[full]"

      - name: Renderizar todos os arquivos YAML
        run: |
          for file in *.yaml; do
            if [ -f "$file" ]; then
              filename=$(basename "$file" .yaml)
              echo "Renderizando $file..."
              rendercv render "$file" --output-folder-name "rendercv_output/$filename"
            fi
          done

      - name: Commit of generated files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f rendercv_output/
          git commit -m "docs: render commit [skip ci]" || exit 0
          git push
